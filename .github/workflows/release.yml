name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认令牌权限收敛为只读：发布流程不需要写仓库
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 版本号有 package.json / tauri.conf.json / PKGBUILD 多个来源，
      # 不校验就会出现 v9.9.9 的 tag 里装着 0.3.4 的产物
      - name: Verify version consistency
        run: |
          V=$(node -p "require('./package.json').version")
          T=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$T" != "$V" ]; then
            echo "::error::src-tauri/tauri.conf.json 的 $T 与 package.json 的 $V 不一致"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 v$V 不一致"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 第三方 action 固定到 commit，避免 tag/分支被改写后执行任意代码
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (non-macOS)
        if: matrix.os != 'macos-latest'
        run: npm run tauri build -- --ci --target ${{ matrix.target }}

      # 仅当仓库变量 REQUIRE_MACOS_SIGNING=1 时才强制要求签名。
      # 目前仓库没有配置 Apple 凭据，发布走 ad-hoc 签名并在日志里告警，
      # 硬失败会让每次 tag 发布直接变红；等凭据配好再把变量置 1，
      # 那时缺凭据（证书过期/secret 被删）就会让发布失败而不是静默出未公证包
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_MACOS_SIGNING }}
        run: bash scripts/package-macos-dmg.sh ${{ matrix.target }}

      - name: Package tar.gz (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/${{ matrix.target }}/release
          tar -czf "bundle/GitSync-${VERSION}-linux-x86_64.tar.gz" GitSync

      - name: Build Arch Linux package
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/target/${{ matrix.target }}/release/GitSync aur/
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
          docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c 'makepkg -fd --noconfirm'
          "
          mkdir -p src-tauri/target/${{ matrix.target }}/release/bundle/arch
          cp aur/gitsync-[0-9]*.pkg.tar.zst src-tauri/target/${{ matrix.target }}/release/bundle/arch/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*
            src-tauri/target/${{ matrix.target }}/release/bundle/arch/*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*
            src-tauri/target/${{ matrix.target }}/release/bundle/*.tar.gz
          if-no-files-found: error
