name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 默认令牌权限收敛为只读：注入或恶意依赖脚本拿到的令牌无法 push / 删 artifact
permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
    # 第三方 action 固定到 commit：tag / 分支可变，被改写即可在高权限 job 里执行任意代码
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
    - run: npm ci
    # cargo test 编译时需要 dist 存在（tauri::generate_context! 会读取 frontendDist）
    - name: Build frontend for tests
      run: npm run build
    - name: Run Rust tests
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml
    - run: npm run tauri build -- --ci
    - name: Package tar.gz (Linux)
      run: |
        VERSION=$(node -p "require('./package.json').version")
        cd src-tauri/target/release
        tar -czf "bundle/GitSync-${VERSION}-linux-$(uname -m).tar.gz" GitSync
    - name: Build Arch Linux package
      run: |
        VERSION=$(node -p "require('./package.json').version")
        cp src-tauri/target/release/GitSync aur/
        sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
        docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:latest bash -c "
          pacman -Syu --noconfirm base-devel
          useradd -m builder
          chown -R builder:builder /pkg
          su builder -c 'makepkg -fd --noconfirm'
        "
        mkdir -p src-tauri/target/release/bundle/arch
        cp aur/gitsync-*.pkg.tar.zst src-tauri/target/release/bundle/arch/
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.pkg.tar.zst' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.pkg' \) -exec basename {} \; | sort -u)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-ubuntu
        path: |
          src-tauri/target/release/bundle/deb/*
          src-tauri/target/release/bundle/rpm/*
          src-tauri/target/release/bundle/arch/*
          src-tauri/target/release/bundle/*.tar.gz
        if-no-files-found: error

  publish-ubuntu:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-ubuntu.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-ubuntu
        path: out
    # 文件名含 package.json 的 version，属 PR 可控输入：经 env 传递并做白名单校验，
    # 直接插值进 run 会被 shell 二次解析（文件名里带引号即可逃逸）
    - name: Move installer
      env:
        ARTIFACT: ${{ matrix.file }}
      run: |
        case "$ARTIFACT" in
          "" | *[!A-Za-z0-9._+-]*) echo "::error::非法产物文件名: $ARTIFACT"; exit 1 ;;
        esac
        find out -type f -name "$ARTIFACT" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
    - run: npm ci
    - run: npm run tauri build -- --ci
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f -exec basename {} \;)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-windows
        path: |
          src-tauri/target/release/bundle/msi/*
          src-tauri/target/release/bundle/nsis/*
        if-no-files-found: error

  publish-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-windows.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-windows
        path: out
    - name: Move installer
      env:
        ARTIFACT: ${{ matrix.file }}
      run: |
        case "$ARTIFACT" in
          "" | *[!A-Za-z0-9._+-]*) echo "::error::非法产物文件名: $ARTIFACT"; exit 1 ;;
        esac
        find out -type f -name "$ARTIFACT" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    # 签名凭据只给非 PR 运行：fork PR 本来拿不到 secrets，但同仓库分支的 PR
    # 会带着 6 个 APPLE_* 跑 PR 改过的 npm scripts / build.rs，等于把
    # Developer ID 证书交出去。PR 上走空值 -> 脚本自动降级为 ad-hoc 签名
    env:
      APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
    - run: npm ci
    - name: Package macOS DMG
      run: bash scripts/package-macos-dmg.sh
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f -name '*.dmg' -exec basename {} \; | sort -u)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-macos
        path: |
          src-tauri/target/release/bundle/dmg/*
          src-tauri/target/release/bundle/macos/*
        if-no-files-found: error

  publish-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-macos.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-macos
        path: out
    - name: Move installer
      env:
        ARTIFACT: ${{ matrix.file }}
      run: |
        case "$ARTIFACT" in
          "" | *[!A-Za-z0-9._+-]*) echo "::error::非法产物文件名: $ARTIFACT"; exit 1 ;;
        esac
        find out -type f -name "$ARTIFACT" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error
