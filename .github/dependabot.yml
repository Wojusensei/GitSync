version: 2
updates:
  # Rust 依赖：manifest 在 src-tauri 下
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # 同时最多开 3 个 PR，避免首次扫描式刷屏；安全更新不受此限制
    open-pull-requests-limit: 3
    # 新版本发布后先放几天再提，降低刚发布版本出问题的概率；安全更新不受 cooldown 影响
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      # tauri 及插件要跟 npm 侧同 minor，单独一组方便配对升级
      tauri:
        patterns:
          - tauri
          - tauri-*
      # 其余 minor/patch 合成一个 PR；major 仍单独提，方便逐个看
      minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - tauri
          - tauri-*
        update-types:
          - minor
          - patch

  # 前端 + 构建链（vite/postcss 等都在 devDependencies）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      # @tauri-apps/api 与 Rust crate 必须同 minor，单独一组
      tauri:
        patterns:
          - "@tauri-apps/*"
      minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
